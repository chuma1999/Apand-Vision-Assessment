<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Apand Vision CCTV Event Monitor</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- =========================
        HEADER
    ========================== -->

    <header class="header">
      <div>
        <p class="eyebrow">APAND VISION CCTV</p>
        <h1>Event Monitor</h1>
      </div>

      <div class="system-status">
        <span class="status-dot"></span>
        System Online
      </div>
    </header>

    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="container">
      <!-- =========================
             EVENT COUNTERS
        ========================== -->

      <section class="counters" id="counters">
        <!--
                Counters are generated
                by app.js
            -->
      </section>

      <!-- =========================
             FILTERS
        ========================== -->

      <section class="filters">
        <!-- Camera search -->

        <div class="filter-group">
          <label for="cameraSearch"> Camera </label>

          <input
            type="text"
            id="cameraSearch"
            placeholder="Search camera..."
            autocomplete="off"
          />

          <small id="cameraError" class="filter-error"></small>
        </div>

        <!-- Status -->

        <div class="filter-group">
          <label for="statusFilter"> Status </label>

          <select id="statusFilter">
            <option value="all">All Statuses</option>
          </select>
        </div>

        <!-- Event type -->

        <div class="filter-group">
          <label for="eventFilter"> Event Type </label>

          <select id="eventFilter">
            <option value="all">All Event Types</option>
          </select>
        </div>

        <!-- Clear button -->

        <button id="clearFilters" class="clear-button">Clear Filters</button>
      </section>

      <!-- =========================
             EVENTS TABLE
        ========================== -->

      <section class="event-panel">
        <div class="panel-header">
          <div>
            <h2>Detected Events</h2>

            <p>Events retrieved from PostgreSQL</p>
          </div>

          <span id="eventCount"> 0 events </span>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Time</th>

                <th>Event</th>

                <th>Camera</th>

                <th>Location</th>

                <th>Status</th>
              </tr>
            </thead>

            <tbody id="eventTableBody">
              <!--
                            Events are inserted
                            here by app.js
                        -->
            </tbody>
          </table>
        </div>

        <!-- Empty state -->

        <div class="empty-state" id="emptyState">
          <h3>No Events Found</h3>

          <p>There are currently no events matching your search.</p>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
